<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统</title>
    <style>
        *{padding: 0;margin: 0;box-sizing: border-box;}
        body { font-family: 微软雅黑, sans-serif; margin: 0; display: flex; height: 100vh; }
        nav { width: 240px; background: #1f2937; color: white; padding: 20px 0; }
        nav h2 { text-align: center; margin-bottom: 30px; font-size: 20px; }
        nav ul { list-style: none;}
        nav li { padding: 14px 30px; cursor: pointer; border-bottom: 1px solid #374151;transition: 0.2s;}
        nav li.active-menu { background:#2563eb; color: #fff; }
        nav li:hover { background: #374151; }
        main { flex: 1; padding: 40px; background-color: #f8f9fa; overflow-y: auto}
        .page { display: none; }
        .page.active { display: block; }
        h2 { margin-bottom: 20px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: #fff;}
        th, td { padding: 12px 15px; border: 1px solid #eee; text-align: left;}
        th { background: #2563eb; color: white; font-weight: normal; }
        button { padding: 5px 12px; border: none; background: #2563eb; color: #fff; border-radius: 3px; cursor: pointer;}
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <nav>
        <h2>图书管理系统</h2>
        <ul>
            <li class="active-menu" onclick="showPage('book-list');getBookList()">图书列表</li>
            <li onclick="showPage('borrow-list');getBorrowList()">当前在借</li>
            <li onclick="showPage('borrow-history');getBorrowHistory()">借阅记录</li>
            <li onclick="showPage('purchase-history');getBuyList()">购买记录</li>
        </ul>
    </nav>
    <main>
        <div id="book-list" class="page active">
            <h2>图书列表</h2>
            <table>
                <thead><tr><th>图书ID</th><th>书名</th><th>作者</th><th>图书数量</th><th>单价</th><th>操作</th></tr></thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>
        <div id="borrow-list" class="page">
            <h2>当前在借</h2>
            <table>
                <thead><tr><th>借阅ID</th><th>图书ID</th><th>图书名字</th><th>用户ID</th><th>借阅数量</th><th>操作</th></tr></thead>
                <tbody id="borrowTableBody"></tbody>
            </table>
        </div>
        <div id="borrow-history" class="page">
            <h2>借阅记录</h2>
            <table>
                 <thead><tr><th>借阅ID</th><th>图书ID</th><th>图书名字</th><th>用户ID</th><th>借阅数量</th></tr></thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
        <div id="purchase-history" class="page">
            <h2>购买记录</h2>
            <table><thead><tr><th>购买ID</th><th>图书ID</th><th>书名</th><th>用户ID</th><th>数量</th><th>金额</th></tr></thead>
            <tbody id="buyHistory"><tr><td>暂无购买数据</td><td>——</td><td>——</td></tr></tbody></table>
        </div>
    </main>
    <script>
        function showPage(pageId) {
            document.querySelectorAll('nav li').forEach(item => item.classList.remove('active-menu'));
            event.target.classList.add('active-menu');
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
        const baseUrl = "/api";

        async function getBookList(){
            const res = await fetch(`${baseUrl}/getBookList`);
            const result = await res.json();
            const tbody = document.getElementById("bookTableBody");
            
            if(result.code === 200) {
                if(Array.isArray(result.data)) {
                    let htmlStr = "";
                    result.data.forEach(book => {
                        htmlStr += `
                            <tr>
                                <td>${book.book_id}</td>
                                <td>${book.bookname}</td>
                                <td>${book.author}</td>
                                <td>${book.book_number}</td>
                                <td>${book.price}</td>
                                <td>
                                    <div style="display:flex;justify-content:space-between">
                                        <button onclick="borrowBook('${book.book_id}', 1)">借阅</button>
                                        <button onclick="buyBook('${book.book_id}', 1)">购买</button>
                                    <div>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = htmlStr || '<tr><td colspan="4">暂无图书数据</td></tr>';
                } else {
                    // 兼容后端报错返回的HTML字符串
                    tbody.innerHTML = result.data;
                }
            }
        }
        async function getBorrowList(){
            const res = await fetch(`${baseUrl}/getBorrowList`);
            const result = await res.json();
            const tbody = document.getElementById("borrowTableBody");
            
            if(result.code === 200) {
                if(Array.isArray(result.data)) {
                    let htmlStr = "";
                    result.data.forEach(book => {
                        htmlStr += `
                           <tr>
                                <td>${book.borrow_id}</td>
                                <td>${book.book_id}</td>
                                <td>${book.bookname}</td>
                                <td>${book.user_id}</td>
                                <td>${book.borrow_number}</td>
                                <td><button onclick="pushBook('${book.book_id}', '${book.borrow_id}')">归还</button></td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = htmlStr || '<tr><td colspan="4">暂无借阅数据</td></tr>';
                } else {
                    tbody.innerHTML = result.data;
                }
            }
        }
        async function getBorrowHistory(){
            const res = await fetch(`${baseUrl}/getBorrowHistory`);
            const result = await res.json();
            const tbody = document.getElementById("historyTableBody");
            if(result.code === 200) {
                if(Array.isArray(result.data)) {
                    let htmlStr = "";
                    result.data.forEach(book => {
                        htmlStr += `
                           <tr>
                                <td>${book.borrow_id}</td>
                                <td>${book.book_id}</td>
                                <td>${book.bookname}</td>
                                <td>${book.user_id}</td>
                                <td>${book.borrow_number}</td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = htmlStr || '<tr><td colspan="4">暂无借阅数据</td></tr>';
                } else {
                    tbody.innerHTML = result.data;
                }
            }
        }
        async function getBuyList(){
            const res = await fetch(`${baseUrl}/getBuyList`);
            const result = await res.json();
            const tbody = document.getElementById("buyHistory");
            if(result.code === 200) {
                if(Array.isArray(result.data)) {
                    let htmlStr = "";
                    result.data.forEach(book => {
                        htmlStr += `
                           <tr>
                                <td>${book.buy_id}</td>
                                <td>${book.book_id}</td>
                                <td>${book.bookname}</td>
                                <td>${book.user_id}</td>
                                <td>${book.buy_number}</td>
                                <td>${book.price}</td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = htmlStr || '<tr><td colspan="4">暂无借阅数据</td></tr>';
                } else {
                    tbody.innerHTML = result.data;
                }
            }
        }
        async function borrowBook(currentBookId, currentUserId) {
            const res = await fetch(`${baseUrl}/submitBorrow`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookId: currentBookId, userId: currentUserId }) 
            })
            let d = await res.json();
            alert(d.msg);
            getBookList();
            getBorrowList();
        }
        async function pushBook(currentBookId, currentBorrowId) {
            const res = await fetch(`${baseUrl}/pushBook`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookId: currentBookId, borrowId: currentBorrowId }) 
            })
            let d = await res.json();
            alert(d.msg);
            getBookList();
            getBorrowList();
        }
        async function buyBook(currentBookId) {
            const res = await fetch(`${baseUrl}/buyBook`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookId: currentBookId}) 
            })
            let d = await res.json();
            alert(d.msg);
            getBookList();
            getBuyList();
        }
        window.onload = getBookList;
    </script>
</body>
</html>
